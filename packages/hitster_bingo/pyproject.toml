[project]
name = "hitster-bingo"
version = "0.1.0"
description = "Music bingo party game: disco ball, song deck and Spotify playback in the browser."
authors = [
    { name = "Fay Westendorp", email = "90827054+faywest@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
