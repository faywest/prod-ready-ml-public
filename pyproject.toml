[project]
name = "animal-shelter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fay Westendorp", email = "90827054+faywest@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
animal-shelter = "animal_shelter:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "jupyter>=1.1.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
]
ignore = ['D100', 'D103', 'D101', 'D105', 'D400', 'D401', 'D102', 'E711', 'E402']

[tool.ruff.lint.pydocstyle]
convention = "numpy"
